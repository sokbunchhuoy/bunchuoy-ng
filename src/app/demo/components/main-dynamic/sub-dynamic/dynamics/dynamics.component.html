<!-- data.component.html -->
<p-table [value]="items" selectionMode="single" [(selection)]="selectedItem">
    <ng-template pTemplate="header">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Actions</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>
                <button pButton icon="pi pi-pencil" (click)="editItem(item)"></button>
                <button pButton icon="pi pi-trash" class="p-button-danger" (click)="deleteItem(item)"></button>
            </td>
        </tr>
    </ng-template>
</p-table>

<p-button label="Add Item" icon="pi pi-plus" (click)="addItem()"></p-button>

<p-dialog [(visible)]="displayDialog" [header]="isEditMode ? 'Edit Item' : 'Add Item'" modal="true" [closable]="false">
    <div class="p-fluid">
        <div class="p-field">
            <label for="name">Name</label>
            <!-- <input id="name" type="text" pInputText [(ngModel)]="selectedItem.name" /> -->
        </div>
    </div>
    <p-footer>
        <button pButton label="Save" icon="pi pi-check" (click)="saveItem()"></button>
        <button pButton label="Cancel" icon="pi pi-times" class="p-button-secondary"
            (click)="displayDialog = false"></button>
    </p-footer>
</p-dialog>
