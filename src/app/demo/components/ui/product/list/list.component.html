<p-toast></p-toast>
<div class="grid">
    <div class="col-12">
        <div class="card">
            <h5>Product</h5>
            <button pButton routerLink="/admin/ui/product/add" pRipple label="add" class="p-button-primary"></button>
            <p-table styleClass="mt-3" [value]="product" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
                [tableStyle]="{'min-width': '50rem'}"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                [rowsPerPageOptions]="[5,10,25,50]">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width:10%"># </th>
                        <th style="width:20%">Name </th>
                        <th style="width:20%">Price </th>
                        <th style="width:20%">Quantity</th>
                        <th style="width:20%">Category </th>
                        <th style="width:50%">Action </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-product let-i="rowIndex">
                    <tr>
                        <td>{{ i + 1 }}</td>
                        <td>{{product.name}}</td>
                        <td>{{product.price}}</td>
                        <td>{{product.qty}}</td>
                        <td>{{product.branch | nullShow}}</td>
                        <td>
                            <p-confirmDialog header="Confirmation" icon="pi pi-exclamation-triangle"></p-confirmDialog>
                            <button pButton pRipple routerLink="/admin/ui/product/edit/{{product.id}}"
                                icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"></button>
                            <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"
                                (click)="deleteProductId(product.id)"></button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
<!-- Dialog-->
