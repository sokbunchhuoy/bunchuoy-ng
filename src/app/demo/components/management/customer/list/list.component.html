<p-toast></p-toast>
<div class="grid">
    <div class="col-12">
        <div class="card">
            <h5>Customer</h5>
            <button pButton routerLink="/admin/kh/customer/add" pRipple label="Add"
                class="p-button-primary mr-2"></button>
            <button pButton routerLink="/admin/kh/customer/upload" pRipple label="Upload"
                class="p-button-primary  mr-2"></button>
            <button pButton routerLink="/admin/kh/customer/deactive" pRipple label="Deactive"
                class="p-button-primary"></button>
            <button pButton routerLink="/admin/kh/customer/modelb" pRipple label="Model"
                class="p-button-primary mr-2"></button>
            <p-table styleClass="mt-3" [value]="customer" [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
                [tableStyle]="{'min-width': '50rem'}"
                currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                [rowsPerPageOptions]="[5,10,25,50]">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width:10%">#</th>
                        <th style="width:20%">Code</th>
                        <th style="width:20%">Name</th>
                        <th style="width:20%">Position</th>
                        <th style="width:20%">Email</th>
                        <th style="width:50%">Action</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-customer let-i="rowIndex">
                    <tr>
                        <td>{{ i + 1 }}</td>
                        <td>{{ customer.code }}</td>
                        <td>{{ customer.name }}</td>
                        <td>{{ customer.position }}</td>
                        <td>{{ customer.email | nullShow }}</td>
                        <td>
                            <p-confirmDialog header="Confirmation" icon="pi pi-exclamation-triangle"></p-confirmDialog>
                            <button pButton pRipple routerLink="/admin/kh/customer/add/{{ customer.id }}"
                                icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"></button>
                            <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"
                                (click)="deleteCustomerId(customer)"></button>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
