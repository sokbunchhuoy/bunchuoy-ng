<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <div
            style="border-radius:56px; padding:0.3rem; background: linear-gradient(140deg, var(--primary-color) 100%, rgba(33, 150, 243, 0) 100%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <img src="assets/layout/images/ph.jpg" alt="Image" height="90" class="mb-3">
                    <div class="text-900 text-3xl font-medium mb-3">Login!</div>
                </div>
                <form (ngSubmit)="onLogin()">
                    <div>

                        <label class="block text-900 text-xl font-medium mb-2">user name</label>
                        <input type="text" pInputText [(ngModel)]="username" name="username" required
                            class="w-full md:w-30rem mb-5" style="padding:1rem" placeholder="Type your name" />


                        <label for="password1" class="block text-900 font-medium text-xl mb-2">Password</label>
                        <input type="password" pInputText [(ngModel)]="password" required class="w-full md:w-30rem mb-5"
                            style="padding:1rem" name="password" placeholder="Type your password" />


                        <div class="flex align-items-center justify-content-between mb-5 gap-5">
                            <!-- Show an error message if login fails -->
                            <div *ngIf="loginFailed" class="required">
                                <p>Login failed. Please check your username and password.</p>
                            </div>
                        </div>

                        <button type="submit" pButton label="Login"
                            class="ui-button-primary w-full p-3 text-xl"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
